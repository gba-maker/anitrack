name: Build AniTrack APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3.5.0
      - name: Configure stable debug keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/debug.keystore"
            echo "Using repository-provided debug keystore."
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not configured. A temporary keystore will be generated; Google Sign-In may not work in the resulting APK until its SHA-1 is registered in Firebase."
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "Signing certificate fingerprint (register SHA-1 in Firebase if not already present):"
          keytool -list -v -keystore "$GITHUB_WORKSPACE/debug.keystore" -alias androiddebugkey -storepass android -keypass android | grep -E 'SHA1:|SHA-1:|SHA256:|SHA-256:'
      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "9.3.1"
          arguments: assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anitrack-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
