name: Build AniTrack APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # Store the Firebase Android google-services.json as a GitHub Actions
      # secret named FIREBASE_GOOGLE_SERVICES_JSON_BASE64 (base64-encoded file).
      - name: Configure Firebase
        shell: bash
        env:
          FIREBASE_CONFIG_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$FIREBASE_CONFIG_BASE64" ]; then
            echo "::error::Missing GitHub Actions secret FIREBASE_GOOGLE_SERVICES_JSON_BASE64. Add the base64-encoded Firebase app/google-services.json file as this repository secret."
            exit 1
          fi
          printf '%s' "$FIREBASE_CONFIG_BASE64" | base64 --decode > app/google-services.json
          python3 -c "import json; json.load(open('app/google-services.json'))"

      - name: Generate debug signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anitrack-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
